services:
  server:
    build: src/apps/OpenSignServer
    container_name: OpenSignServer-container
    volumes:
      - opensign-files:/usr/src/app/files
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      - mongo
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - SERVER_URL=${HOST_URL}/api/app
      - PUBLIC_URL=${HOST_URL}
    networks:
      - app-network

  mongo:
    image: mongo:latest
    container_name: mongo-container
    volumes:
      - data-volume:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    networks:
      - app-network

  client:
    build: src/apps/OpenSign
    container_name: OpenSign-container
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      - server
    env_file: .env.prod
    networks:
      - app-network

  caddy:
    image: caddy:latest
    container_name: caddy-container
    ports:
      - "${CADDY_PORT:-3001}:3001"
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    environment:
      - HOST_URL=${HOST_URL}

networks:
  app-network:
    driver: bridge

volumes:
  data-volume:
  opensign-files:
  caddy_data:
  caddy_config:
